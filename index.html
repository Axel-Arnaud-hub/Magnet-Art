<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroMag Lab — joue avec les aimants nanométriques</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="logo"></span>
    <div>
      <h1>MicroMag Lab</h1>
      <p>Le micromagnétisme, en direct, dans ton navigateur</p>
    </div>
  </div>
  <div class="score" id="score"></div>
</header>

<div id="app">
  <nav id="menu" aria-label="Modèles"></nav>

  <main id="stage">
    <div class="titlebar">
      <h2 id="mtitle"></h2>
      <p id="mintro"></p>
    </div>
    <div id="viewwrap">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="toast"></div>
    </div>
    <div id="controls">
      <button id="sensors" class="btn" type="button" aria-pressed="false">📱 Activer les capteurs</button>
      <span id="sensorstatus" role="status" aria-live="polite" class="sensor-status">Inactifs</span>
      <button id="play" class="btn">⏸ Pause</button>
      <button id="restart" class="btn">↺ Réinitialiser</button>
      <label class="speed">Vitesse <input id="speed" type="range" min="0" max="100" step="1" value="50"><output id="speedout">×1.0</output></label>
    </div>
    <div id="plots">
      <canvas id="plot1"></canvas>
      <canvas id="plot2"></canvas>
    </div>
  </main>

  <aside id="panel">
    <section class="card">
      <h3>🎛️ Paramètres</h3>
      <div id="params"></div>
      <div id="actions"></div>
    </section>
    <section class="card">
      <h3>🤔 Et si… ?</h3>
      <div id="whatif"></div>
    </section>
    <section class="card">
      <div class="tabs">
        <button class="tab on" data-pane="tab-observe">🔭 Observe</button>
        <button class="tab" data-pane="tab-why">🧠 Pourquoi ?</button>
        <button class="tab" data-pane="tab-chp">🏆 Défis <span id="chcount"></span></button>
        <button class="tab" data-pane="tab-ub">🧰 Ubermag</button>
      </div>
      <div class="pane on" id="tab-observe"></div>
      <div class="pane" id="tab-why"></div>
      <div class="pane" id="tab-chp"><ul id="tab-ch" class="challenges"></ul><button id="resetscore" class="link">remettre les étoiles à zéro</button></div>
      <div class="pane" id="tab-ub"></div>
    </section>
  </aside>
</div>

<footer>
  <p>Simulations simplifiées inspirées d'<a href="https://ubermag.github.io/" target="_blank" rel="noopener">Ubermag</a> : équation de Landau-Lifshitz-Gilbert résolue directement dans ton navigateur. Pour les calculs de recherche, utilise Ubermag + OOMMF.</p>
</footer>

<script src="js/util.js"></script>
<script src="js/engine/fft.js"></script>
<script src="js/engine/macro_llg.js"></script>
<script src="js/engine/film_llg.js"></script>
<script src="js/sim_base.js"></script>
<script src="js/viz.js"></script>
<script src="js/sims_macro.js"></script>
<script src="js/sims_film.js"></script>
<script src="js/sandbox.js"></script>
<script src="js/models.js"></script>
<script src="js/sensors.js"></script>
<script src="js/app.js"></script>
</body>
</html>
